<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latin verb tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ---------- Marble & Laurel ---------- */
  :root{
    --bg:#f5f1e8;
    --bg-tint-1: rgba(75,94,64,0.10);
    --bg-tint-2: rgba(176,141,87,0.12);
    --ink:#2b2620;
    --ink-soft:#5c5648;
    --accent:#4b5e40;
    --accent-2:#a2793f;
    --panel:#fffdf8;
    --panel-border:#c9bc9c;
    --tile-selected-bg:#4b5e40;
    --tile-selected-text:#fbf7ec;
    --tab-bg:#e7ecdf;
    --tab-border:#8ea27c;
    --tab-active-border:#a2793f;
    --label-bg:#eef1e6;
    --label-text:#4b5e40;
    --wrong-bg:#a3433a;
    --right-bg:#3f7a4e;
    --prompt-accent:#a2793f;
    --pill-bg:#e7ecdf;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  html{min-height:100%;}
  body{
    font-family:"EB Garamond",Garamond,"Cormorant Garamond",Georgia,serif;
    font-size:18px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      linear-gradient(rgba(245,241,232,.55), rgba(245,241,232,.55)),
      url('bg-marble.jpg') center center / cover no-repeat fixed;
  }
  #app{max-width:780px;width:100%;margin:0;padding:36px 20px 60px;position:relative;}
  .header-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  h1.title{
    font-family:"Cinzel",serif;font-size:27px;margin:0 0 8px 0;font-weight:600;
    display:inline-block;letter-spacing:.03em;color:var(--ink);
  }
  .title-wrap{border-bottom:3px double var(--accent);padding-bottom:10px;flex:1;min-width:200px;}
  .header-buttons{display:flex;gap:8px;}
  .chip{
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--panel-border);background:var(--panel);
    border-radius:3px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink);
    user-select:none;font-family:"EB Garamond",Georgia,serif;letter-spacing:.04em;
    font-variant:small-caps;
  }
  .chip:hover{filter:brightness(0.97);}
  .tabbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px;}
  .tab{
    border:1px solid var(--tab-border);background:var(--tab-bg);
    border-radius:3px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink);
    font-variant:small-caps;letter-spacing:.04em;
  }
  .tab.active{border:2px solid var(--tab-active-border);}
  .score{font-size:16px;margin-left:auto;padding-left:8px;color:var(--ink-soft);}
  .prompt-text{font-size:21px;margin:22px 0 14px;}
  .tile-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .tile{
    border:1px solid var(--panel-border);background:var(--panel);color:var(--ink);
    border-radius:3px;padding:9px 15px;font-size:15px;cursor:pointer;
    min-width:44px;text-align:center;
  }
  .tile.selected{background:var(--tile-selected-bg);color:var(--tile-selected-text);border-color:var(--tile-selected-bg);}
  .tile.disabled{opacity:.35;cursor:default;}
  .tile.tiny{padding:5px 9px;font-size:12px;min-width:30px;}
  table.paradigm{border-collapse:collapse;margin:18px auto;}
  table.paradigm td{border:1px solid var(--panel-border);padding:8px 14px;font-size:17px;}
  table.paradigm td.person{background:var(--label-bg);color:var(--label-text);font-weight:600;}
  table.paradigm td.form{background:var(--panel);}
  table.paradigm td.form.placeholder{color:var(--prompt-accent);font-weight:600;cursor:pointer;}
  table.paradigm td.form.clickable:hover{background:var(--bg-tint-2);}
  table.paradigm td.form.wrong{background:var(--wrong-bg);color:#fbf7ec;}
  table.paradigm td.form.right{background:var(--right-bg);color:#fbf7ec;}
  .mark-x{color:#a3433a;font-weight:700;margin-left:6px;}
  .mark-check{color:#3f7a4e;font-weight:700;margin-left:6px;}
  .promptbox{
    border:1px solid var(--panel-border);border-radius:6px;padding:16px;font-size:26px;
    text-align:center;max-width:420px;margin:12px auto;background:var(--panel);
  }
  .qmark{color:var(--prompt-accent);font-weight:700;}
  .feedback{margin-top:14px;font-size:16px;color:var(--label-text);text-align:center;}
  .feedback .line{margin:4px 0;}
  .btn-next{
    display:block;margin:22px auto 0;border:1px solid var(--tab-border);
    background:var(--tab-bg);border-radius:3px;padding:10px 26px;font-size:15px;cursor:pointer;
    font-variant:small-caps;letter-spacing:.04em;
  }
  .verb-pill{background:var(--pill-bg);padding:2px 10px;border-radius:3px;font-weight:600;}
  .type-hint{color:var(--prompt-accent);font-weight:600;margin:2px 0;text-align:center;font-size:18px;}
  .type-inputs{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap;}
  .type-inputs input{
    border:1px solid var(--panel-border);border-radius:3px;padding:10px 12px;font-size:16px;width:260px;
    font-family:inherit;background:var(--panel);color:var(--ink);
  }
  .type-inputs input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .keybox{background:var(--tab-bg);padding:12px 14px;border-radius:4px;margin-top:20px;font-size:14px;}
  .keybox .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .note-box{max-width:520px;margin:20px auto;text-align:center;font-style:italic;color:var(--ink-soft);}
  .results-entry{border-top:1px solid var(--panel-border);padding:14px 0;}
  .results-entry:first-child{border-top:none;}
  .results-prompt{color:var(--prompt-accent);font-weight:700;font-size:18px;}
  .results-line{color:var(--label-text);margin-top:4px;}
  .setup-label-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 0 10px;}
  .decor{width:100%;max-width:360px;display:block;margin:0 auto 8px;opacity:.85;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,16,10,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;}
  .modal{background:var(--panel);border-radius:8px;max-width:600px;width:100%;padding:24px 26px;border:1px solid var(--panel-border);}
  .modal h2{margin-top:0;font-family:"Cinzel",serif;font-weight:600;font-size:20px;}
  .modal p{line-height:1.55;font-size:15px;}
  .modal .close-btn{float:right;}
  .drill-grid{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;max-height:320px;overflow:auto;border:1px solid var(--panel-border);padding:10px;border-radius:4px;background:var(--panel);}
  .drill-tile{border:1px solid var(--panel-border);border-radius:3px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--panel);color:var(--ink);}
  .drill-tile.selected{background:var(--tile-selected-bg);color:var(--tile-selected-text);border-color:var(--tile-selected-bg);}
  .drill-group-label{width:100%;font-weight:700;margin:10px 0 2px;font-size:14px;color:var(--accent);font-variant:small-caps;}
  .drill-meaning{font-size:21px;text-align:center;margin:20px 0 6px;}
  .drill-given{text-align:center;font-size:16px;color:var(--ink-soft);margin-bottom:10px;}
  .drill-given b{color:var(--ink);}
  .drill-fields{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0;}
  .drill-field{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .drill-field label{font-size:12px;color:var(--ink-soft);}
  .drill-field input{border:1px solid var(--panel-border);border-radius:3px;padding:8px 10px;width:150px;font-size:15px;font-family:inherit;background:var(--panel);color:var(--ink);}
  .drill-field.right input{border-color:var(--right-bg);}
  .drill-field.wrong input{border-color:var(--wrong-bg);}
  .toggle-row{display:flex;gap:14px;align-items:center;justify-content:center;margin:10px 0 18px;font-size:14px;flex-wrap:wrap;}
  .toggle-opt{display:flex;align-items:center;gap:6px;cursor:pointer;}
  a.footnote-link{color:var(--label-text);}

  .grid-table{border-collapse:collapse;margin:8px 0 4px;width:100%;}
  .grid-table th, .grid-table td{border:1px solid var(--panel-border);padding:6px 8px;text-align:center;}
  .grid-table th{background:var(--label-bg);color:var(--label-text);font-weight:600;font-size:13px;font-variant:small-caps;}
  .grid-table td.tense-label{background:var(--label-bg);color:var(--label-text);font-weight:600;text-align:left;padding-left:10px;font-variant:small-caps;}
  .grid-cell{
    display:inline-block;width:100%;padding:6px 4px;border-radius:3px;cursor:pointer;
    border:1px solid var(--panel-border);background:var(--panel);font-size:13px;
  }
  .grid-cell.on{background:var(--tile-selected-bg);color:var(--tile-selected-text);border-color:var(--tile-selected-bg);}
  .grid-cell.na{opacity:.25;cursor:default;background:transparent;border-style:dashed;}
  .grid-wrap{overflow-x:auto;}

  .home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:24px;}
  @media (max-width:520px){ .home-grid{grid-template-columns:1fr;} }
  .home-card{
    border:1px solid var(--panel-border);background:var(--panel);border-radius:8px;
    padding:22px 20px;cursor:pointer;text-align:left;transition:transform .15s ease, box-shadow .15s ease;
  }
  .home-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(43,38,32,.12);border-color:var(--accent);}
  .home-card h3{margin:0 0 8px;font-family:"Cinzel",serif;font-size:17px;font-weight:600;color:var(--accent);letter-spacing:.02em;}
  .home-card p{margin:0;font-size:14.5px;color:var(--ink-soft);line-height:1.45;}
  .home-intro{font-size:17px;color:var(--ink-soft);margin-top:10px;max-width:560px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================== DATA ============================== */

const MACRON_MAP = {'ā':'a','ē':'e','ī':'i','ō':'o','ū':'u','Ā':'A','Ē':'E','Ī':'I','Ō':'O','Ū':'U'};
function stripMacrons(s){ return s.split('').map(c=>MACRON_MAP[c]||c).join(''); }
function normalize(s){ return stripMacrons(String(s||'')).toLowerCase().trim().replace(/\s+/g,' '); }
function matchAnswer(input, variants){
  const n = normalize(input);
  if(!n) return false;
  return variants.some(v=>normalize(v)===n);
}

const V = s => s.split('/');
const P6 = (...xs) => xs.map(V);

function mkVerbForms(f){ return f; }

const VERBS = {
  amo: { key:'amo', label:'amō', conj:1, pp:['amō','amāre','amāvī','amātum'], meaning:'love',
    forms:{
      pres:{
        act:{ indic:P6("amō","amās","amat","amāmus","amātis","amant"),
              subj:P6("amem","amēs","amet","amēmus","amētis","ament"),
              imper:{"2sg":V("amā"),"2pl":V("amāte")},
              infin:V("amāre"), ptcp:V("amāns, amantis") },
        pass:{ indic:P6("amor","amāris/amāre","amātur","amāmur","amāminī","amantur"),
               subj:P6("amer","amēris/amēre","amētur","amēmur","amēminī","amentur"),
               imper:{"2sg":V("amāre"),"2pl":V("amāminī")},
               infin:V("amārī") } },
      impf:{
        act:{ indic:P6("amābam","amābās","amābat","amābāmus","amābātis","amābant"),
              subj:P6("amārem","amārēs","amāret","amārēmus","amārētis","amārent") },
        pass:{ indic:P6("amābar","amābāris/amābāre","amābātur","amābāmur","amābāminī","amābantur"),
               subj:P6("amārer","amārēris/amārēre","amārētur","amārēmur","amārēminī","amārentur") } },
      fut:{
        act:{ indic:P6("amābō","amābis","amābit","amābimus","amābitis","amābunt"),
              imper:{"2sg":V("amātō"),"3sg":V("amātō"),"2pl":V("amātōte"),"3pl":V("amantō")},
              infin:V("amātūrus esse"), ptcp:V("amātūrus, -a, -um") },
        pass:{ indic:P6("amābor","amāberis/amābere","amābitur","amābimur","amābiminī","amābuntur"),
               imper:{"2sg":V("amātor"),"3sg":V("amātor"),"3pl":V("amantor")},
               infin:V("amātum īrī"), ptcp:V("amandus, -a, -um") } },
      perf:{
        act:{ indic:P6("amāvī","amāvistī","amāvit","amāvimus","amāvistis","amāvērunt/amāvēre"),
              subj:P6("amāverim","amāverīs","amāverit","amāverīmus","amāverītis","amāverint"),
              infin:V("amāvisse") },
        pass:{ indic:P6("amātus sum","amātus es","amātus est","amātī sumus","amātī estis","amātī sunt"),
               subj:P6("amātus sim","amātus sīs","amātus sit","amātī sīmus","amātī sītis","amātī sint"),
               infin:V("amātus esse"), ptcp:V("amātus, -a, -um") } },
      plup:{
        act:{ indic:P6("amāveram","amāverās","amāverat","amāverāmus","amāverātis","amāverant"),
              subj:P6("amāvissem","amāvissēs","amāvisset","amāvissēmus","amāvissētis","amāvissent") },
        pass:{ indic:P6("amātus eram","amātus erās","amātus erat","amātī erāmus","amātī erātis","amātī erant"),
               subj:P6("amātus essem","amātus essēs","amātus esset","amātī essēmus","amātī essētis","amātī essent") } },
      futperf:{
        act:{ indic:P6("amāverō","amāveris","amāverit","amāverimus","amāveritis","amāverint") },
        pass:{ indic:P6("amātus erō","amātus eris","amātus erit","amātī erimus","amātī eritis","amātī erunt") } }
    }
  },
  moneo: { key:'moneo', label:'moneō', conj:2, pp:['moneō','monēre','monuī','monitum'], meaning:'warn, advise',
    forms:{
      pres:{
        act:{ indic:P6("moneō","monēs","monet","monēmus","monētis","monent"),
              subj:P6("moneam","moneās","moneat","moneāmus","moneātis","moneant"),
              imper:{"2sg":V("monē"),"2pl":V("monēte")},
              infin:V("monēre"), ptcp:V("monēns, monentis") },
        pass:{ indic:P6("moneor","monēris/monēre","monētur","monēmur","monēminī","monentur"),
               subj:P6("monear","moneāris/moneāre","moneātur","moneāmur","moneāminī","moneantur"),
               imper:{"2sg":V("monēre"),"2pl":V("monēminī")},
               infin:V("monērī") } },
      impf:{
        act:{ indic:P6("monēbam","monēbās","monēbat","monēbāmus","monēbātis","monēbant"),
              subj:P6("monērem","monērēs","monēret","monērēmus","monērētis","monērent") },
        pass:{ indic:P6("monēbar","monēbāris/monēbāre","monēbātur","monēbāmur","monēbāminī","monēbantur"),
               subj:P6("monērer","monērēris/monērēre","monērētur","monērēmur","monērēminī","monērentur") } },
      fut:{
        act:{ indic:P6("monēbō","monēbis","monēbit","monēbimus","monēbitis","monēbunt"),
              imper:{"2sg":V("monētō"),"3sg":V("monētō"),"2pl":V("monētōte"),"3pl":V("monentō")},
              infin:V("monitūrus esse"), ptcp:V("monitūrus, -a, -um") },
        pass:{ indic:P6("monēbor","monēberis/monēbere","monēbitur","monēbimur","monēbiminī","monēbuntur"),
               imper:{"2sg":V("monētor"),"3sg":V("monētor"),"3pl":V("monentor")},
               infin:V("monitum īrī"), ptcp:V("monendus, -a, -um") } },
      perf:{
        act:{ indic:P6("monuī","monuistī","monuit","monuimus","monuistis","monuērunt/monuēre"),
              subj:P6("monuerim","monuerīs","monuerit","monuerīmus","monuerītis","monuerint"),
              infin:V("monuisse") },
        pass:{ indic:P6("monitus sum","monitus es","monitus est","monitī sumus","monitī estis","monitī sunt"),
               subj:P6("monitus sim","monitus sīs","monitus sit","monitī sīmus","monitī sītis","monitī sint"),
               infin:V("monitus esse"), ptcp:V("monitus, -a, -um") } },
      plup:{
        act:{ indic:P6("monueram","monuerās","monuerat","monuerāmus","monuerātis","monuerant"),
              subj:P6("monuissem","monuissēs","monuisset","monuissēmus","monuissētis","monuissent") },
        pass:{ indic:P6("monitus eram","monitus erās","monitus erat","monitī erāmus","monitī erātis","monitī erant"),
               subj:P6("monitus essem","monitus essēs","monitus esset","monitī essēmus","monitī essētis","monitī essent") } },
      futperf:{
        act:{ indic:P6("monuerō","monueris","monuerit","monuerimus","monueritis","monuerint") },
        pass:{ indic:P6("monitus erō","monitus eris","monitus erit","monitī erimus","monitī eritis","monitī erunt") } }
    }
  },
  mitto: { key:'mitto', label:'mittō', conj:3, pp:['mittō','mittere','mīsī','missum'], meaning:'send',
    forms:{
      pres:{
        act:{ indic:P6("mittō","mittis","mittit","mittimus","mittitis","mittunt"),
              subj:P6("mittam","mittās","mittat","mittāmus","mittātis","mittant"),
              imper:{"2sg":V("mitte"),"2pl":V("mittite")},
              infin:V("mittere"), ptcp:V("mittēns, mittentis") },
        pass:{ indic:P6("mittor","mitteris/mittere","mittitur","mittimur","mittiminī","mittuntur"),
               subj:P6("mittar","mittāris/mittāre","mittātur","mittāmur","mittāminī","mittantur"),
               imper:{"2sg":V("mittere"),"2pl":V("mittiminī")},
               infin:V("mittī") } },
      impf:{
        act:{ indic:P6("mittēbam","mittēbās","mittēbat","mittēbāmus","mittēbātis","mittēbant"),
              subj:P6("mitterem","mitterēs","mitteret","mitterēmus","mitterētis","mitterent") },
        pass:{ indic:P6("mittēbar","mittēbāris/mittēbāre","mittēbātur","mittēbāmur","mittēbāminī","mittēbantur"),
               subj:P6("mitterer","mitterēris/mitterēre","mitterētur","mitterēmur","mitterēminī","mitterentur") } },
      fut:{
        act:{ indic:P6("mittam","mittēs","mittet","mittēmus","mittētis","mittent"),
              imper:{"2sg":V("mittitō"),"3sg":V("mittitō"),"2pl":V("mittitōte"),"3pl":V("mittuntō")},
              infin:V("missūrus esse"), ptcp:V("missūrus, -a, -um") },
        pass:{ indic:P6("mittar","mittēris/mittēre","mittētur","mittēmur","mittēminī","mittentur"),
               imper:{"2sg":V("mittitor"),"3sg":V("mittitor"),"3pl":V("mittuntor")},
               infin:V("missum īrī"), ptcp:V("mittendus, -a, -um") } },
      perf:{
        act:{ indic:P6("mīsī","mīsistī","mīsit","mīsimus","mīsistis","mīsērunt/mīsēre"),
              subj:P6("mīserim","mīserīs","mīserit","mīserīmus","mīserītis","mīserint"),
              infin:V("mīsisse") },
        pass:{ indic:P6("missus sum","missus es","missus est","missī sumus","missī estis","missī sunt"),
               subj:P6("missus sim","missus sīs","missus sit","missī sīmus","missī sītis","missī sint"),
               infin:V("missus esse"), ptcp:V("missus, -a, -um") } },
      plup:{
        act:{ indic:P6("mīseram","mīserās","mīserat","mīserāmus","mīserātis","mīserant"),
              subj:P6("mīsissem","mīsissēs","mīsisset","mīsissēmus","mīsissētis","mīsissent") },
        pass:{ indic:P6("missus eram","missus erās","missus erat","missī erāmus","missī erātis","missī erant"),
               subj:P6("missus essem","missus essēs","missus esset","missī essēmus","missī essētis","missī essent") } },
      futperf:{
        act:{ indic:P6("mīserō","mīseris","mīserit","mīserimus","mīseritis","mīserint") },
        pass:{ indic:P6("missus erō","missus eris","missus erit","missī erimus","missī eritis","missī erunt") } }
    }
  },
  audio: { key:'audio', label:'audiō', conj:4, pp:['audiō','audīre','audīvī','audītum'], meaning:'hear',
    forms:{
      pres:{
        act:{ indic:P6("audiō","audīs","audit","audīmus","audītis","audiunt"),
              subj:P6("audiam","audiās","audiat","audiāmus","audiātis","audiant"),
              imper:{"2sg":V("audī"),"2pl":V("audīte")},
              infin:V("audīre"), ptcp:V("audiēns, audientis") },
        pass:{ indic:P6("audior","audīris/audīre","audītur","audīmur","audīminī","audiuntur"),
               subj:P6("audiar","audiāris/audiāre","audiātur","audiāmur","audiāminī","audiantur"),
               imper:{"2sg":V("audīre"),"2pl":V("audīminī")},

/* base gap table, verb-independent (used to build PARSE grid & REVIEW structure) */
function cellExistsBase(mood,tense,voice){
  if(mood==='indic') return true; // all 6 tenses x both voices
  if(mood==='subj') return ['pres','impf','perf','plup'].includes(tense);
  if(mood==='imper') return ['pres','fut'].includes(tense);
  if(mood==='infin') return ['pres','perf','fut'].includes(tense);
  if(mood==='ptcp'){
    if(tense==='pres') return voice==='act';
    if(tense==='fut') return true;
    if(tense==='perf') return voice==='pass';
    return false;
  }
  return false;
}
/* verb-specific gap table (adds sum's restrictions) */
function cellExists(verbKey,mood,tense,voice){
  if(!cellExistsBase(mood,tense,voice)) return false;
  if(verbKey==='sum'){
    if(voice==='pass') return false;
    if(mood==='ptcp' && tense==='pres') return false;
  }
  return true;
}

function imperSlots(tense,voice){
  if(tense==='pres') return ['2sg','2pl'];
  if(tense==='fut') return voice==='act' ? ['2sg','3sg','2pl','3pl'] : ['2sg','3sg','3pl'];
  return [];
}

function getCell(verbKey,tense,voice,mood){
  const f = VERBS[verbKey].forms;
  if(!f[tense] || !f[tense][voice]) return undefined;
  return f[tense][voice][mood];
}

/* ============================== PARSE / TYPE ENGINE ============================== */

function flattenPersonBearingCells(verbKeys, tenses, voices, moods){
  const pool = [];
  verbKeys.forEach(vk=>{
    tenses.forEach(t=>{
      voices.forEach(vc=>{
        moods.forEach(m=>{
          if(m!=='indic' && m!=='subj' && m!=='imper') return;
          if(!cellExists(vk,m,t,vc)) return;
          if(m==='imper'){
            imperSlots(t,vc).forEach(slot=>{
              const variants = getCell(vk,t,vc,m)[slot];
              if(variants) pool.push({verb:vk,tense:t,voice:vc,mood:m,personKey:slot,label:IMPER_SLOT_LABEL[slot],full:IMPER_SLOT_FULL[slot],variants});
            });
          } else {
            const arr = getCell(vk,t,vc,m);
            if(arr){
              arr.forEach((variants,idx)=>{
                pool.push({verb:vk,tense:t,voice:vc,mood:m,personKey:String(idx),label:PERSON_LABELS[idx],full:PERSON_FULL[idx],variants});
              });
            }
          }
        });
      });
    });
  });
  return pool;
}

function currentPool(){
  const pool = [];
  const verbKeys = [...state.setup.verbs];
  verbKeys.forEach(vk=>{
    TENSE_TILES.forEach(t=>{
      const g = state.setup.grid[t];
      if(!g) return;
      pool.push(...flattenPersonBearingCells([vk], [t], [...g.voices], [...g.moods]));
    });
  });
  return pool;
}

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function acceptedAnswersFor(verbKey, surfaceForm){
  // find every (tense,voice,mood,person) whose form matches surfaceForm for this verb, within indic/subj/imper scope
  const n = normalize(surfaceForm);
  const all = flattenPersonBearingCells([verbKey], TENSE_TILES, VOICES, MOODS);
  return all.filter(c=>c.variants.some(v=>normalize(v)===n));
}

function fmtTuple(c){
  return `${TENSE_LABEL[c.tense]} ${VOICE_LABEL[c.voice]} ${MOOD_LABEL[c.mood]} ${c.label}`;
}

function newParseQuestion(){
  const pool = currentPool();
  if(pool.length===0){ state.parseQuestion=null; return; }
  const target = pickRandom(pool);
  const word = target.variants[0];
  state.parseQuestion = { verb:target.verb, word, target };
  state.parseSel = {tense:null,voice:null,mood:null};
  state.parseResult = null;
  state.parseAttempts = 0;
  state.parseTryAgain = null;
}

function newTypeQuestion(){
  const pool = currentPool();
  if(pool.length===0){ state.typeQuestion=null; return; }
  const target = pickRandom(pool);
  state.typeQuestion = target;
  state.typeResult = null;
  state.typeAttempts = 0;
  state.typeTryAgain = null;
}

function renderReview(){
  const sel = state.reviewSel;
  const tenseItems = TENSE_TILES.map(t=>({key:t,label:TENSE_LABEL[t]}));
  const voiceItems = VOICES.map(v=>({key:v,label:VOICE_LABEL[v]}));
  const moodItems = MOODS.map(m=>({key:m,label:MOOD_LABEL[m]}));
  const verbItems = VERB_ORDER.map(v=>({key:v,label:VERBS[v].label}));
  let body;
  if(!cellExists(sel.verb, sel.mood, sel.tense, sel.voice)){
    body = `<p class="note-box">${reviewGapNote(sel)}</p>`;
  } else {
    body = renderParadigmTable(sel.verb, sel.tense, sel.voice, sel.mood, null, null);
  }
  return `
    ${tileRow(tenseItems, sel.tense, 'review-tense', false)}
    ${tileRow(voiceItems, sel.voice, 'review-voice', false)}
    ${tileRow(moodItems, sel.mood, 'review-mood', false)}
    ${tileRow(verbItems, sel.verb, 'review-verb', false)}
    ${body}
  `;
}

function reviewGapNote(sel){
  if(sel.verb==='sum' && sel.voice==='pass') return 'sum has no passive forms.';
  if(sel.mood==='subj' && ['fut','futperf'].includes(sel.tense)) return 'Latin has no future subjunctive.';
  if(sel.mood==='imper' && ['impf','perf','plup','futperf'].includes(sel.tense)) return 'Latin has no imperfect/perfect-system imperative.';
  if(sel.mood==='infin' && ['impf','plup','futperf'].includes(sel.tense)) return 'Latin has no imperfect/pluperfect/future-perfect infinitive.';
  if(sel.mood==='ptcp'){
    if(sel.tense==='pres' && sel.voice==='pass') return 'There is no present passive participle in Latin.';
    if(sel.tense==='perf' && sel.voice==='act') return 'There is no perfect active participle for regular verbs (only deponents have one).';
    if(['impf','plup','futperf'].includes(sel.tense)) return 'Latin participles exist only in the present, future, and perfect.';
    if(sel.verb==='sum') return 'sum has only a future participle (futūrus).';
  }
  return 'That combination does not exist in Latin.';
}

function renderParadigmTable(verbKey, tense, voice, mood, clickMode, questionState){
  // clickMode: null (review, plain display) | 'parse-placeholder' | 'parse-revealed'
  if(mood==='infin'){
    const variants = getCell(verbKey,tense,voice,mood);
    if(!variants) return `<p class="note-box">No such infinitive exists.</p>`;
    return `<table class="paradigm"><tr><td class="person">infin</td><td class="form">${variants[0]}</td></tr></table>`;
  }
  if(mood==='ptcp'){
    const variants = getCell(verbKey,tense,voice,mood);
    if(!variants) return `<p class="note-box">No such participle exists.</p>`;
    const note = tense==='pres' ? '<p class="note-box">shown as nom. sg. masc. (participles decline like 1st/2nd or 3rd declension adjectives)</p>' : '';
    return `<table class="paradigm"><tr><td class="person">ptcp</td><td class="form">${variants[0]}</td></tr></table>${note}`;
  }
  if(mood==='imper'){
    const slots = imperSlots(tense,voice);
    const cellObj = getCell(verbKey,tense,voice,mood) || {};
    const rows = slots.map(slot=>{
      const variants = cellObj[slot];
      const label = IMPER_SLOT_LABEL[slot];
      let cellHtml;
      if(clickMode==='parse-placeholder'){
        cellHtml = `<td class="form placeholder clickable" data-parse-cell="${slot}"><span class="qmark">???</span></td>`;
      } else if(clickMode==='parse-revealed'){
        const isChosen = questionState.chosenKey===slot;
        const cls = isChosen ? (questionState.correct? 'right':'wrong') : '';
        const mark = isChosen ? (questionState.correct?'<span class="mark-check">&#10003;</span>':'<span class="mark-x">&#10007;</span>') : '';
        cellHtml = `<td class="form ${cls}">${variants?variants[0]:'&mdash;'}${mark}</td>`;
      } else {
        cellHtml = `<td class="form">${variants?variants[0]:'&mdash;'}</td>`;
      }
      return `<tr><td class="person">${label}</td>${cellHtml}</tr>`;
    }).join('');
    return `<table class="paradigm">${rows}</table>`;
  }
  // indic / subj: 6 rows
  const arr = getCell(verbKey,tense,voice,mood);
  const rows = PERSON_LABELS.map((label,idx)=>{
    let cellHtml;
    if(clickMode==='parse-placeholder'){
      cellHtml = `<td class="form placeholder clickable" data-parse-cell="${idx}"><span class="qmark">???</span></td>`;
    } else if(clickMode==='parse-revealed'){
      const isChosen = questionState.chosenKey===String(idx);
      const cls = isChosen ? (questionState.correct? 'right':'wrong') : '';
      const mark = isChosen ? (questionState.correct?'<span class="mark-check">&#10003;</span>':'<span class="mark-x">&#10007;</span>') : '';
      const variants = arr ? arr[idx] : null;
      cellHtml = `<td class="form ${cls}">${variants?variants[0]:'&mdash;'}${mark}</td>`;
    } else {
      const variants = arr ? arr[idx] : null;
      cellHtml = `<td class="form">${variants?variants[0]:'&mdash;'}</td>`;
    }
    return `<tr><td class="person">${label}</td>${cellHtml}</tr>`;
  }).join('');
  return `<table class="paradigm">${rows}</table>`;
}

/* ============================== PARSE ============================== */

function renderParse(){
  if(!state.parseQuestion) newParseQuestion();
  const q = state.parseQuestion;
  if(!q){
    return `<p class="note-box">No verb/tense/voice/mood combination is currently selected on SET-UP. Go to SET-UP and select at least one valid combination.</p>`;
  }
  const sel = state.parseSel;
  const tenseItems = TENSE_TILES.map(t=>({key:t,label:TENSE_LABEL[t]}));
  const voiceItems = VOICES.map(v=>({key:v,label:VOICE_LABEL[v]}));
  const moodItems = MOODS.filter(m=>m==='indic'||m==='subj'||m==='imper').map(m=>({key:m,label:MOOD_LABEL[m]}));

  let tableHtml = '';
  const allChosen = sel.tense && sel.voice && sel.mood;
  if(allChosen){
    if(!state.parseResult && !cellExistsBase(sel.mood, sel.tense, sel.voice)){
      tableHtml = `<p class="note-box">No such form exists &mdash; pick a different tense/voice/mood.</p>`;
    } else if(state.parseResult){
      tableHtml = renderParadigmTable(q.verb, state.parseResult.tense, state.parseResult.voice, state.parseResult.mood, 'parse-revealed', state.parseResult);
    } else if(!cellExists(q.verb, sel.mood, sel.tense, sel.voice)){
      tableHtml = `<p class="note-box">No such form exists &mdash; pick a different tense/voice/mood.</p>`;
    } else {
      tableHtml = renderParadigmTable(q.verb, sel.tense, sel.voice, sel.mood, 'parse-placeholder', null);
    }
  }

  let feedback = '';
  if(state.parseResult){
    const r = state.parseResult;
    feedback = `<div class="feedback">
      <div class="line">${fmtTuple({tense:r.tense,voice:r.voice,mood:r.mood,label:r.chosenLabel})} ${r.correct?'<span class="mark-check">&#10003;</span>':'<span class="mark-x">&#10007;</span>'}</div>
      <div class="line">You could have chosen: ${r.acceptedList.map(fmtTuple).join(' / ')}</div>
    </div>
    <div class="btn-next" data-action="parse-next">NEXT</div>`;
  } else if(state.parseTryAgain){
    feedback = `<div class="feedback" style="color:#c0392b;">
      <div class="line">${fmtTuple({tense:state.parseTryAgain.tense,voice:state.parseTryAgain.voice,mood:state.parseTryAgain.mood,label:state.parseTryAgain.chosenLabel})} <span class="mark-x">&#10007;</span></div>
      <div class="line">Not quite &mdash; you have one more try.</div>
    </div>`;
  }

  const skipBtn = state.parseResult ? '' : `<div class="chip" data-action="parse-skip" style="display:block;margin:14px auto 0;width:fit-content;">SKIP</div>`;

  return `
    <div class="promptbox">${q.word}</div>
    <p class="prompt-text" style="text-align:center;font-size:18px;">Where would you find this Latin verb form?<br>Pick tense, voice, and mood, then a <span class="qmark">???</span> box.</p>
    ${tileRow(tenseItems, sel.tense, 'parse-tense', false)}
    ${tileRow(voiceItems, sel.voice, 'parse-voice', false)}
    ${tileRow(moodItems, sel.mood, 'parse-mood', false)}
    ${tableHtml}
    ${skipBtn}
    ${feedback}
  `;
}

const MAX_ATTEMPTS = 2;

function submitParseGuess(chosenKey){
  const q = state.parseQuestion;
  const sel = state.parseSel;
  const accepted = acceptedAnswersFor(q.verb, q.word);
  const isImper = sel.mood==='imper';
  const chosenLabel = isImper ? IMPER_SLOT_LABEL[chosenKey] : PERSON_LABELS[Number(chosenKey)];
  const correct = accepted.some(a=>a.tense===sel.tense && a.voice===sel.voice && a.mood===sel.mood && a.personKey===chosenKey);
  state.parseAttempts++;

  if(correct || state.parseAttempts>=MAX_ATTEMPTS){
    state.parseResult = {
      tense:sel.tense, voice:sel.voice, mood:sel.mood, chosenKey, chosenLabel, correct,
      acceptedList: accepted
    };
    state.score.attempted++;
    if(correct) state.score.correct++;
    state.log.unshift({
      kind:'parse', prompt:q.word,
      chosen: fmtTuple({tense:sel.tense,voice:sel.voice,mood:sel.mood,label:chosenLabel}),
      correct, correctAnswer: accepted.map(fmtTuple).join(' / ')
    });
  } else {
    state.parseTryAgain = { tense:sel.tense, voice:sel.voice, mood:sel.mood, chosenLabel };
  }
}

/* ============================== TYPE ============================== */

function renderType(){
  if(!state.typeQuestion) newTypeQuestion();
  const q = state.typeQuestion;
  if(!q){
    return `<p class="note-box">No verb/tense/voice/mood combination is currently selected on SET-UP. Go to SET-UP and select at least one valid combination.</p>`;
  }
  const full = q.mood==='imper' ? q.full : PERSON_FULL[Number(q.personKey)];
  const tryAgainNote = (state.typeTryAgain && !state.typeResult)
    ? `<p class="feedback" style="color:#c0392b;">Not quite (you typed: ${state.typeTryAgain.chosen}) &mdash; you have one more try. <span class="mark-x">&#10007;</span></p>`
    : '';
  let bottom;
  if(state.typeResult){
    const r = state.typeResult;
    bottom = `<p class="feedback"><span class="line">${r.correct?'Correct <span class="mark-check">&#10003;</span>':'Incorrect <span class="mark-x">&#10007;</span>'}</span>
      <span class="line">Correct form${q.variants.length>1?'s':''}: ${q.variants.join(' / ')}</span></p>
      <div class="btn-next" data-action="type-next">NEXT</div>`;
  } else {
    bottom = `<div style="display:flex;gap:10px;justify-content:center;margin-top:22px;">
      <div class="chip" data-action="type-submit" style="padding:10px 26px;font-size:15px;">CHECK</div>
      <div class="chip" data-action="type-skip" style="padding:10px 26px;font-size:15px;">SKIP</div>
    </div>`;
  }
  return `
    <p class="prompt-text" style="text-align:center;">Type this form of <span class="verb-pill">${VERBS[q.verb].label}</span></p>
    <p class="type-hint">${TENSE_FULL[q.tense]} ${VOICE_FULL[q.voice]} ${MOOD_FULL[q.mood]}</p>
    <p class="type-hint">${full}</p>
    <div class="type-inputs">
      <input id="type-box1" type="text" ${state.typeResult?'disabled':''} autocomplete="off" spellcheck="false">
      ${q.variants.some(v=>v.trim().includes(' ')) ? `<input id="type-box2" type="text" ${state.typeResult?'disabled':''} autocomplete="off" spellcheck="false">` : ''}
    </div>
    <div class="keybox">
      <strong>Macrons:</strong> you don't need to type them &mdash; <em>amabam</em> and <em>am&#257;bam</em> are both accepted. Long vowels are shown in the answer key as &#257; &#275; &#299; &#333; &#363;.
    </div>
    ${tryAgainNote}
    ${bottom}
  `;
}

function submitTypeGuess(){
  const q = state.typeQuestion;
  const b1 = document.getElementById('type-box1')?.value || '';
  const b2 = document.getElementById('type-box2')?.value || '';
  const combined = `${b1} ${b2}`.trim();
  const correct = matchAnswer(b1,q.variants) || matchAnswer(b2,q.variants) || matchAnswer(combined,q.variants);
  state.typeAttempts++;

  if(correct || state.typeAttempts>=MAX_ATTEMPTS){
    state.typeResult = { correct };
    state.score.attempted++;
    if(correct) state.score.correct++;
    const promptLabel = `${VERBS[q.verb].label} ${TENSE_LABEL[q.tense]} ${VOICE_LABEL[q.voice]} ${MOOD_LABEL[q.mood]} ${q.label}`;
    state.log.unshift({
      kind:'type', prompt:promptLabel,
      chosen: [b1,b2].filter(Boolean).join(' / ') || '(blank)',
      correct, correctAnswer: q.variants.join(' / ')
    });
  } else {
    state.typeTryAgain = { chosen: [b1,b2].filter(Boolean).join(' / ') || '(blank)' };
  }
}

/* ============================== RESULTS ============================== */

function renderResults(){
  if(state.log.length===0){

}

/* ============================== DRILL MODE ============================== */

function renderDrillSetup(){
  const groups = {};
  DRILL_VERBS.forEach(v=>{ (groups[v.group] = groups[v.group]||[]).push(v); });
  const groupOrder = ['1st conjugation','2nd conjugation','3rd conjugation','3rd conjugation, -iō','4th conjugation','Irregular / defective'];
  let html = `<div class="setup-label-row">
      <div class="prompt-text" style="margin:0;">Choose verbs to drill.</div>
      <div style="display:flex;gap:8px;">
        <div class="chip" data-action="drill-all">ALL</div>
        <div class="chip" data-action="drill-none">NONE</div>
      </div>
    </div>
    <div class="toggle-row">
      <label class="toggle-opt"><input type="radio" name="drillmode" ${!state.drillHardMode?'checked':''} data-action="drill-mode-easy"> Fill in the missing part (default)</label>
      <label class="toggle-opt"><input type="radio" name="drillmode" ${state.drillHardMode?'checked':''} data-action="drill-mode-hard"> Meaning only, type all 4 (harder)</label>
    </div>
    <div class="drill-grid">`;
  groupOrder.forEach(g=>{
    if(!groups[g]) return;
    html += `<div class="drill-group-label">${g}</div>`;
    groups[g].forEach(v=>{
      const sel = state.drillVerbIds.has(v.id);
      html += `<div class="drill-tile ${sel?'selected':''}" data-drillverb="${v.id}">${v.parts[0]}${v.defective?' *':''}</div>`;
    });
  });
  html += `</div><p class="note-box" style="font-size:12px;">* defective verb &mdash; only its existing principal parts are drilled.</p>`;
  return html;
}

function pickNextDrillVerb(){
  const scope = DRILL_VERBS.filter(v=>state.drillVerbIds.has(v.id));
  if(scope.length===0) return null;
  if(state.drillQueue.length===0){
    state.drillQueue = [...scope].sort(()=>Math.random()-0.5).map(v=>v.id);
  }
  const id = state.drillQueue.shift();
  return DRILL_VERBS.find(v=>v.id===id);
}

const PART_LABELS = ['1st','2nd','3rd','4th'];

function newDrillQuestion(){
  const v = pickNextDrillVerb();
  state.drillQuestion = v;
  state.drillResult = null;
  if(v && !state.drillHardMode){
    const existingIdx = [0,1,2,3].filter(i=>v.parts[i]!==null);
    state.drillBlankIdx = pickRandom(existingIdx);
  } else {
    state.drillBlankIdx = null;
  }
}

function renderDrill(){
  if(!state.drillQuestion) newDrillQuestion();
  const v = state.drillQuestion;
  if(!v){
    return `<p class="note-box">No verbs selected. Go to SET-UP and choose at least one verb.</p>`;
  }
  const existing = v.parts.map(p=>p!==null);

  if(state.drillHardMode){
    const fieldsToShow = [0,1,2,3].filter(i=>existing[i]);
    const top = `<p class="drill-meaning">${v.meaning}</p>`;
    let fields = `<div class="drill-fields">`;
    fieldsToShow.forEach(i=>{
      let cls = '';
      if(state.drillResult) cls = state.drillResult.fieldCorrect[i] ? 'right' : 'wrong';
      fields += `<div class="drill-field ${cls}">
        <label>${PART_LABELS[i]} part</label>
        <input id="drill-field-${i}" type="text" ${state.drillResult?'disabled':''} autocomplete="off" spellcheck="false">
      </div>`;
    });
    fields += `</div>`;
    let bottom;
    if(state.drillResult){
      const r = state.drillResult;
      const correctParts = fieldsToShow.map(i=>`${PART_LABELS[i]}: ${Array.isArray(v.parts[i])?v.parts[i].join(' / '):v.parts[i]}`).join(', ');
      bottom = `<p class="feedback"><span class="line">${r.allCorrect?'All correct <span class="mark-check">&#10003;</span>':'Some incorrect <span class="mark-x">&#10007;</span>'}</span>
        <span class="line">Correct: ${correctParts}</span></p>
        <div class="btn-next" data-action="drill-next">NEXT</div>`;
    } else {
      bottom = `<div class="btn-next" data-action="drill-submit">CHECK</div>`;
    }
    return `${top}${fields}${bottom}`;
  }

  // Default mode: random blank among the parts that exist for this verb.
  const blankIdx = state.drillBlankIdx;
  const givenIdx = [0,1,2,3].filter(i=>existing[i] && i!==blankIdx);
  const givenText = givenIdx.map(i=>`<b>${PART_LABELS[i]}:</b> ${Array.isArray(v.parts[i])?v.parts[i].join(' / '):v.parts[i]}`).join('&nbsp;&nbsp;&nbsp;');

  const top = `<p class="drill-meaning">${v.meaning}</p><p class="drill-given">${givenText}</p>`;

  let cls = '';
  if(state.drillResult) cls = state.drillResult.fieldCorrect[blankIdx] ? 'right' : 'wrong';
  const fields = `<div class="drill-fields">
    <div class="drill-field ${cls}">
      <label>${PART_LABELS[blankIdx]} part</label>
      <input id="drill-field-${blankIdx}" type="text" ${state.drillResult?'disabled':''} autocomplete="off" spellcheck="false">
    </div>
  </div>`;

  let bottom;
  if(state.drillResult){
    const r = state.drillResult;
    const correctAnswer = Array.isArray(v.parts[blankIdx]) ? v.parts[blankIdx].join(' / ') : v.parts[blankIdx];
    bottom = `<p class="feedback"><span class="line">${r.allCorrect?'Correct <span class="mark-check">&#10003;</span>':'Incorrect <span class="mark-x">&#10007;</span>'}</span>
      <span class="line">${PART_LABELS[blankIdx]} part: ${correctAnswer}</span></p>
      <div class="btn-next" data-action="drill-next">NEXT</div>`;
  } else {
    bottom = `<div class="btn-next" data-action="drill-submit">CHECK</div>`;
  }
  return `${top}${fields}${bottom}`;
}

function submitDrillGuess(){
  const v = state.drillQuestion;
  const existing = v.parts.map(p=>p!==null);
  const fieldsToShow = state.drillHardMode ? [0,1,2,3].filter(i=>existing[i]) : [state.drillBlankIdx];
  const fieldCorrect = {};
  let allCorrect = true;
  const userVals = {};
  fieldsToShow.forEach(i=>{
    const val = document.getElementById('drill-field-'+i)?.value || '';
    userVals[i]=val;
    const accepted = Array.isArray(v.parts[i]) ? v.parts[i] : [v.parts[i]];
    const ok = matchAnswer(val, accepted);
    fieldCorrect[i]=ok;
    if(!ok) allCorrect=false;
  });
  state.drillResult = { fieldCorrect, allCorrect };
  state.drillScore.attempted++;
  if(allCorrect) state.drillScore.correct++;
  const chosen = fieldsToShow.map(i=>`${PART_LABELS[i]}: ${userVals[i]||'(blank)'}`).join(', ');
  const correctAnswer = fieldsToShow.map(i=>`${PART_LABELS[i]}: ${Array.isArray(v.parts[i])?v.parts[i].join(' / '):v.parts[i]}`).join(', ');
  state.drillLog.unshift({
    prompt: `${v.parts[0]} &mdash; ${v.meaning}`,
    chosen, correct: allCorrect, correctAnswer
  });
}

function renderDrillResults(){
  if(state.drillLog.length===0){
    return `<p class="prompt-text">Your results so far (${state.drillScore.correct}/${state.drillScore.attempted})</p><p class="note-box">No attempts yet.</p>`;
  }
  return `<p class="prompt-text">Your results so far (${state.drillScore.correct}/${state.drillScore.attempted})</p>
  ${state.drillLog.map(e=>`
    <div class="results-entry">
      <div class="results-prompt">${e.prompt}</div>
      <div class="results-line">You chose: ${e.chosen} ${e.correct?'<span class="mark-check">&#10003;</span>':'<span class="mark-x">&#10007;</span>'}</div>
      ${(!e.correct)?`<div class="results-line">Correct: ${e.correctAnswer}</div>`:''}
    </div>
  `).join('')}`;
}

/* ============================== NOUN TESTER ============================== */

function ordinal(n){ return {1:'1st',2:'2nd',3:'3rd',4:'4th',5:'5th'}[n] || (n+'th'); }

function invalidateNounQuestions(){
  state.nounParseQuestion = null; state.nounParseResult = null;
  state.nounParseSel = { declension:null, gender:null, cs:null, num:null };
  state.nounParseAttempts = 0; state.nounParseTryAgain = null;
  state.nounTypeQuestion = null; state.nounTypeResult = null;
  state.nounTypeAttempts = 0; state.nounTypeTryAgain = null;
}

function nounFlatten(nounKeys, cases, numbers){
  const pool = [];
  nounKeys.forEach(nk=>{
    numbers.forEach(num=>{
      cases.forEach(cs=>{
        const variants = getNounCell(nk,cs,num);
        if(variants) pool.push({noun:nk, cs, num, variants});
      });
    });
  });
  return pool;
}

function nounCurrentPool(){
  return nounFlatten([...state.nounSetup.nouns], [...state.nounSetup.cases], [...state.nounSetup.numbers]);
}

function nounAcceptedAnswers(nounKey, surfaceForm){
  const n = normalize(surfaceForm);
  const all = nounFlatten([nounKey], CASES, NUMBERS);
  return all.filter(c=>c.variants.some(v=>normalize(v)===n));
}

function newNounParseQuestion(){
  const pool = nounCurrentPool();
  if(pool.length===0){ state.nounParseQuestion=null; return; }
  const target = pickRandom(pool);
  const word = target.variants[0];
  state.nounParseQuestion = { noun:target.noun, word, target };
  state.nounParseSel = { declension:null, gender:null, cs:null, num:null };
  state.nounParseResult = null;
  state.nounParseAttempts = 0;
  state.nounParseTryAgain = null;
}

function newNounTypeQuestion(){
  const pool = nounCurrentPool();
  if(pool.length===0){ state.nounTypeQuestion=null; return; }
  const target = pickRandom(pool);
  state.nounTypeQuestion = target;
  state.nounTypeResult = null;
  state.nounTypeAttempts = 0;
  state.nounTypeTryAgain = null;
}

function renderNounParse(){
  if(!state.nounParseQuestion) newNounParseQuestion();
  const q = state.nounParseQuestion;
  if(!q) return `<p class="note-box">No case/number/noun combination is selected on SET-UP. Go to SET-UP and select at least one.</p>`;
  const sel = state.nounParseSel;
  const declItems = [1,2,3,4,5].map(d=>({key:String(d),label:ordinal(d)}));
  const genderItems = ['m','f','n'].map(g=>({key:g,label:GENDER_LABEL[g]}));
  const caseItems = CASES.map(c=>({key:c,label:CASE_LABEL[c]}));
  const numberItems = NUMBERS.map(nn=>({key:nn,label:NUMBER_LABEL[nn]}));

  let feedback = '';
  if(state.nounParseResult){
    const r = state.nounParseResult;
    feedback = `<div class="feedback">
      <div class="line">${ordinal(Number(r.declension))} decl, ${GENDER_LABEL[r.gender]||'?'}, ${CASE_LABEL[r.cs]} ${NUMBER_LABEL[r.num]} ${r.correct?'<span class="mark-check">&#10003;</span>':'<span class="mark-x">&#10007;</span>'}</div>
      <div class="line">Correct: ${ordinal(r.correctDeclension)} decl, ${r.correctGenders.map(g=>GENDER_LABEL[g]).join('/')}, ${r.acceptedList.map(a=>CASE_LABEL[a.cs]+' '+NUMBER_LABEL[a.num]).join(' / ')}</div>
    </div>
    <div class="btn-next" data-action="noun-parse-next">NEXT</div>`;
  } else if(state.nounParseTryAgain){
    feedback = `<div class="feedback" style="color:#c0392b;"><div class="line">Not quite &mdash; you have one more try. <span class="mark-x">&#10007;</span></div></div>`;
  }

  const skipBtn = state.nounParseResult ? '' : `<div class="chip" data-action="noun-parse-skip" style="display:block;margin:14px auto 0;width:fit-content;">SKIP</div>`;
  const canCheck = sel.declension && sel.gender && sel.cs && sel.num;
  const checkBtn = (!state.nounParseResult) ? `<div class="btn-next" data-action="noun-parse-check" style="${canCheck?'':'opacity:.4;pointer-events:none;'}">CHECK</div>` : '';

  return `
    <div class="promptbox">${q.word}</div>
    <p class="prompt-text" style="text-align:center;font-size:18px;">What declension, gender, case, and number is this noun form?</p>
    <div style="margin:6px 0 4px;font-size:13px;color:var(--ink-soft);font-variant:small-caps;">Declension</div>
    ${tileRow(declItems, sel.declension, 'noun-parse-decl', false)}
    <div style="margin:6px 0 4px;font-size:13px;color:var(--ink-soft);font-variant:small-caps;">Gender</div>
    ${tileRow(genderItems, sel.gender, 'noun-parse-gender', false)}
    <div style="margin:6px 0 4px;font-size:13px;color:var(--ink-soft);font-variant:small-caps;">Case</div>
    ${tileRow(caseItems, sel.cs, 'noun-parse-case', false)}
    <div style="margin:6px 0 4px;font-size:13px;color:var(--ink-soft);font-variant:small-caps;">Number</div>
    ${tileRow(numberItems, sel.num, 'noun-parse-number', false)}
    ${checkBtn}
    ${skipBtn}
    ${feedback}
  `;
}

function submitNounParseGuess(){
  const q = state.nounParseQuestion;
  const sel = state.nounParseSel;
  const noun = NOUNS[q.noun];
  const accepted = nounAcceptedAnswers(q.noun, q.word);
  const correct = Number(sel.declension)===noun.declension && noun.genders.includes(sel.gender) && accepted.some(a=>a.cs===sel.cs && a.num===sel.num);
  state.nounParseAttempts++;

  if(correct || state.nounParseAttempts>=MAX_ATTEMPTS){
    state.nounParseResult = {
      declension:sel.declension, gender:sel.gender, cs:sel.cs, num:sel.num, correct,
      acceptedList: accepted, correctDeclension: noun.declension, correctGenders: noun.genders
    };
    state.nounScore.attempted++;
    if(correct) state.nounScore.correct++;
    state.nounLog.unshift({
      kind:'parse', prompt:q.word,
      chosen: `${ordinal(Number(sel.declension))} decl, ${GENDER_LABEL[sel.gender]||'?'}, ${CASE_LABEL[sel.cs]} ${NUMBER_LABEL[sel.num]}`,
      correct,
      correctAnswer: `${ordinal(noun.declension)} decl, ${noun.genders.map(g=>GENDER_LABEL[g]).join('/')}, ${accepted.map(a=>CASE_LABEL[a.cs]+' '+NUMBER_LABEL[a.num]).join(' / ')}`
    });
  } else {
    state.nounParseTryAgain = { declension:sel.declension, gender:sel.gender, cs:sel.cs, num:sel.num };
  }
}

function submitNounTypeGuess(){
  const q = state.nounTypeQuestion;
  const b1 = document.getElementById('noun-type-box1')?.value || '';
  const b2 = document.getElementById('noun-type-box2')?.value || '';
  const correct = matchAnswer(b1,q.variants) || matchAnswer(b2,q.variants);
  state.nounTypeAttempts++;

  if(correct || state.nounTypeAttempts>=MAX_ATTEMPTS){
    state.nounTypeResult = { correct };
    state.nounScore.attempted++;
    if(correct) state.nounScore.correct++;
    const promptLabel = `${NOUNS[q.noun].label} ${CASE_LABEL[q.cs]} ${NUMBER_LABEL[q.num]}`;
    state.nounLog.unshift({
      kind:'type', prompt:promptLabel,
      chosen: [b1,b2].filter(Boolean).join(' / ') || '(blank)',
      correct, correctAnswer: q.variants.join(' / ')
    });
  } else {
    state.nounTypeTryAgain = true;
  }
}

function renderNounResults(){
  if(state.nounLog.length===0){
    return `<p class="prompt-text">Your results so far (${state.nounScore.correct}/${state.nounScore.attempted})</p><p class="note-box">No attempts yet &mdash; try PARSE or TYPE.</p>`;

  return `<p class="prompt-text">Your results so far (${state.nounScore.correct}/${state.nounScore.attempted})</p>

}

/* ============================== VOCAB TESTER ============================== */

function vocabHeadword(latinField){ return latinField.split(',')[0].trim(); }

function vocabPool(){ return VOCAB.filter(w=>state.vocabSetup.categories.has(w.category)); }

function newVocabQuestion(){
  const pool = vocabPool();
  if(pool.length===0){ state.vocabQuestion=null; return; }
  const word = pickRandom(pool);
  let direction = state.vocabSetup.direction;
  if(direction==='both') direction = Math.random()<0.5 ? 'la-en' : 'en-la';
  let mcqOptions = null;
  if(state.vocabSetup.mode==='mcq'){
    const distractorSource = pool.length>=4 ? pool : VOCAB;
    const others = distractorSource.filter(w=>w.latin!==word.latin);
    const shuffled = [...others].sort(()=>Math.random()-0.5);
    const distractors = shuffled.slice(0,3);
    const optionWords = [word, ...distractors].sort(()=>Math.random()-0.5);
    mcqOptions = optionWords.map(w=> direction==='la-en' ? w.meanings[0] : w.latin);
  }
  state.vocabQuestion = { word, direction, mcqOptions };
  state.vocabResult = null;
}

function finalizeVocabAnswer(correct, userAnswerText){
  const q = state.vocabQuestion;
  state.vocabResult = { correct };
  state.vocabScore.attempted++;
  if(correct) state.vocabScore.correct++;
  const promptLabel = q.direction==='la-en' ? q.word.latin : q.word.meanings.join(' / ');
  const correctAnswer = q.direction==='la-en' ? q.word.meanings.join(' / ') : q.word.latin;
  state.vocabLog.unshift({ prompt: promptLabel, chosen: userAnswerText || '(blank)', correct, correctAnswer });
}

function submitVocabMCQ(optionText){
  const q = state.vocabQuestion;
  const correctText = q.direction==='la-en' ? q.word.meanings[0] : q.word.latin;
  finalizeVocabAnswer(optionText===correctText, optionText);
}

function submitVocabType(){
  const q = state.vocabQuestion;
  const val = document.getElementById('vocab-type-box')?.value || '';
  const correct = q.direction==='la-en' ? matchAnswer(val, q.word.meanings) : matchAnswer(val, [vocabHeadword(q.word.latin)]);
  finalizeVocabAnswer(correct, val);
}

function renderVocabQuiz(){
  if(!state.vocabQuestion) newVocabQuestion();
  const q = state.vocabQuestion;
  if(!q) return `<p class="note-box">No word categories selected. Go to SET-UP and choose at least one.</p>`;
  const promptText = q.direction==='la-en' ? q.word.latin : q.word.meanings.join(' / ');
  const promptLabelText = q.direction==='la-en' ? 'What does this mean?' : 'What is the Latin word?';

  let body;
  if(state.vocabResult){
    const r = state.vocabResult;
    const correctAnswer = q.direction==='la-en' ? q.word.meanings.join(' / ') : q.word.latin;
    body = `<p class="feedback"><span class="line">${r.correct?'Correct <span class="mark-check">&#10003;</span>':'Incorrect <span class="mark-x">&#10007;</span>'}</span>

    body = `<div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px;">

  return `

    <p class="prompt-text" style="text-align:center;font-size:17px;">${promptLabelText}</p>
    ${body}

}

function renderVocabResults(){

  }

function render(){
  document.body.setAttribute('data-mode', state.mode);
  const app = document.getElementById('app');
  let inner = '';
  if(state.mode==='home'){
    inner += renderHome();
  } else if(state.mode==='conjugation'){
    inner += headerHtml('Latin verb tester');
    inner += tabbarHtml([['setup','SET-UP'],['review','REVIEW'],['parse','PARSE'],['type','TYPE'],['results','RESULTS']], state.activeTab, 'tab', state.score);
    if(state.activeTab==='setup') inner += renderSetup();
    else if(state.activeTab==='review') inner += renderReview();
    else if(state.activeTab==='parse') inner += renderParse();
    else if(state.activeTab==='type') inner += renderType();
    else if(state.activeTab==='results') inner += renderResults();
  } else if(state.mode==='drill'){
    inner += headerHtml('Latin principal parts drill');
    inner += tabbarHtml([['setup','SET-UP'],['drill','DRILL'],['results','RESULTS']], state.drillActiveTab, 'drilltab', state.drillScore);
    if(state.drillActiveTab==='setup') inner += renderDrillSetup();
    else if(state.drillActiveTab==='drill') inner += renderDrill();
    else if(state.drillActiveTab==='results') inner += renderDrillResults();
  } else if(state.mode==='nouns'){
    inner += headerHtml('Latin noun tester');
    inner += tabbarHtml([['setup','SET-UP'],['review','REVIEW'],['parse','PARSE'],['type','TYPE'],['results','RESULTS']], state.nounActiveTab, 'nountab', state.nounScore);
    if(state.nounActiveTab==='setup') inner += renderNounSetup();
    else if(state.nounActiveTab==='review') inner += renderNounReview();
    else if(state.nounActiveTab==='parse') inner += renderNounParse();
    else if(state.nounActiveTab==='type') inner += renderNounType();
    else if(state.nounActiveTab==='results') inner += renderNounResults();
  } else if(state.mode==='vocab'){
    inner += headerHtml('Latin vocabulary tester');
    inner += tabbarHtml([['setup','SET-UP'],['quiz','QUIZ'],['results','RESULTS']], state.vocabActiveTab, 'vocabtab', state.vocabScore);
    if(state.vocabActiveTab==='setup') inner += renderVocabSetup();
    else if(state.vocabActiveTab==='quiz') inner += renderVocabQuiz();
    else if(state.vocabActiveTab==='results') inner += renderVocabResults();
  }
  app.innerHTML = inner;

  if(state.helpOpen){
    const backdrop = el(`<div class="modal-backdrop"><div class="modal">
      <span class="chip close-btn" data-action="help-close">CLOSE</span>
      ${helpContent()}
    </div></div>`);
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop){ state.helpOpen=false; render(); } });
  }
}

/* ============================== EVENTS ============================== */

document.addEventListener('click', e=>{
  const t = e.target;

  if(t.dataset.action==='menu'){ state.mode='home'; render(); return; }
  const cardEl = t.closest && t.closest('[data-goto-mode]');
  if(cardEl){ state.mode = cardEl.dataset.gotoMode; render(); return; }
  if(t.dataset.action==='help'){ state.helpOpen=true; render(); return; }
  if(t.dataset.action==='help-close'){ state.helpOpen=false; render(); return; }

  if(t.dataset.tab){ state.activeTab = t.dataset.tab; render(); return; }
  if(t.dataset.drilltab){ state.drillActiveTab = t.dataset.drilltab; render(); return; }
  if(t.dataset.nountab){ state.nounActiveTab = t.dataset.nountab; render(); return; }
  if(t.dataset.vocabtab){ state.vocabActiveTab = t.dataset.vocabtab; render(); return; }

  // SET-UP toggles
  if(t.dataset.gridVoice){
    const [tense,voice] = t.dataset.gridVoice.split(':');
    toggleSet(state.setup.grid[tense].voices, voice);
    invalidateQuestions(); render(); return;
  }
  if(t.dataset.gridMood){
    const [tense,mood] = t.dataset.gridMood.split(':');
    toggleSet(state.setup.grid[tense].moods, mood);
    invalidateQuestions(); render(); return;
  }
  if(t.dataset.gridTenseToggle){
    const tense = t.dataset.gridTenseToggle;
    const g = state.setup.grid[tense];
    const fullyOn = g.voices.size===VOICES.length && g.moods.size===PARSE_MOODS.length;
    if(fullyOn){ g.voices = new Set(); g.moods = new Set(); }
    else { g.voices = new Set(VOICES); g.moods = new Set(PARSE_MOODS); }
    invalidateQuestions(); render(); return;
  }
  if(t.dataset.setupVerb){ toggleSet(state.setup.verbs, t.dataset.setupVerb); invalidateQuestions(); render(); return; }
  if(t.dataset.action==='setup-all'){ state.setup=freshSetup(); invalidateQuestions(); render(); return; }
  if(t.dataset.action==='setup-none'){ state.setup=emptySetup(); invalidateQuestions(); render(); return; }

  // REVIEW single-select
  if(t.dataset.reviewTense){ state.reviewSel.tense=t.dataset.reviewTense; render(); return; }
  if(t.dataset.reviewVoice){ state.reviewSel.voice=t.dataset.reviewVoice; render(); return; }
  if(t.dataset.reviewMood){ state.reviewSel.mood=t.dataset.reviewMood; render(); return; }
  if(t.dataset.reviewVerb){ state.reviewSel.verb=t.dataset.reviewVerb; render(); return; }

  // PARSE
  if(t.dataset.parseTense){ if(!state.parseResult){ state.parseSel.tense=t.dataset.parseTense; render(); } return; }
  if(t.dataset.parseVoice){ if(!state.parseResult){ state.parseSel.voice=t.dataset.parseVoice; render(); } return; }
  if(t.dataset.parseMood){ if(!state.parseResult){ state.parseSel.mood=t.dataset.parseMood; render(); } return; }
  const parseCellEl = t.closest && t.closest('[data-parse-cell]');
  if(parseCellEl){ if(!state.parseResult){ submitParseGuess(parseCellEl.dataset.parseCell); render(); } return; }
  if(t.dataset.action==='parse-next'){ newParseQuestion(); render(); return; }
  if(t.dataset.action==='parse-skip'){ newParseQuestion(); render(); return; }

  // TYPE
  if(t.dataset.action==='type-submit'){ submitTypeGuess(); render(); return; }
  if(t.dataset.action==='type-next'){ newTypeQuestion(); render(); return; }
  if(t.dataset.action==='type-skip'){ newTypeQuestion(); render(); return; }

  // DRILL
  if(t.dataset.drillverb){ toggleSet(state.drillVerbIds, t.dataset.drillverb); render(); return; }
  if(t.dataset.action==='drill-all'){ state.drillVerbIds=new Set(DRILL_VERBS_DEFAULT_IDS()); render(); return; }
  if(t.dataset.action==='drill-none'){ state.drillVerbIds=new Set(); render(); return; }
  if(t.dataset.action==='drill-mode-easy'){ state.drillHardMode=false; state.drillQueue=[]; state.drillQuestion=null; render(); return; }
  if(t.dataset.action==='drill-mode-hard'){ state.drillHardMode=true; state.drillQueue=[]; state.drillQuestion=null; render(); return; }
  if(t.dataset.action==='drill-submit'){ submitDrillGuess(); render(); return; }
  if(t.dataset.action==='drill-next'){ newDrillQuestion(); render(); return; }

  // NOUN SET-UP
  if(t.dataset.nounSetupCase){ toggleSet(state.nounSetup.cases, t.dataset.nounSetupCase); invalidateNounQuestions(); render(); return; }
  if(t.dataset.nounSetupNumber){ toggleSet(state.nounSetup.numbers, t.dataset.nounSetupNumber); invalidateNounQuestions(); render(); return; }
  if(t.dataset.nounSetupNoun){ toggleSet(state.nounSetup.nouns, t.dataset.nounSetupNoun); invalidateNounQuestions(); render(); return; }
  if(t.dataset.action==='noun-setup-all'){
    state.nounSetup = { cases:new Set(CASES), numbers:new Set(NUMBERS), nouns:new Set(NOUN_ORDER) };
    invalidateNounQuestions(); render(); return;
  }
  if(t.dataset.action==='noun-setup-none'){
    state.nounSetup = { cases:new Set(), numbers:new Set(), nouns:new Set() };
    invalidateNounQuestions(); render(); return;
  }

  // NOUN REVIEW
  if(t.dataset.nounReviewNoun){ state.nounReviewSel.noun = t.dataset.nounReviewNoun; render(); return; }

  // NOUN PARSE
  if(t.dataset.nounParseDecl){ if(!state.nounParseResult){ state.nounParseSel.declension=t.dataset.nounParseDecl; render(); } return; }
  if(t.dataset.nounParseGender){ if(!state.nounParseResult){ state.nounParseSel.gender=t.dataset.nounParseGender; render(); } return; }
  if(t.dataset.nounParseCase){ if(!state.nounParseResult){ state.nounParseSel.cs=t.dataset.nounParseCase; render(); } return; }
  if(t.dataset.nounParseNumber){ if(!state.nounParseResult){ state.nounParseSel.num=t.dataset.nounParseNumber; render(); } return; }
  if(t.dataset.action==='noun-parse-check'){
    const sel = state.nounParseSel;
    if(!state.nounParseResult && sel.declension && sel.gender && sel.cs && sel.num){ submitNounParseGuess(); render(); }
    return;
  }
  if(t.dataset.action==='noun-parse-next'){ newNounParseQuestion(); render(); return; }
  if(t.dataset.action==='noun-parse-skip'){ newNounParseQuestion(); render(); return; }

  // NOUN TYPE
  if(t.dataset.action==='noun-type-submit'){ submitNounTypeGuess(); render(); return; }
  if(t.dataset.action==='noun-type-next'){ newNounTypeQuestion(); render(); return; }
  if(t.dataset.action==='noun-type-skip'){ newNounTypeQuestion(); render(); return; }

  // VOCAB SET-UP
  if(t.dataset.vocabSetupCat){ toggleSet(state.vocabSetup.categories, t.dataset.vocabSetupCat); state.vocabQuestion=null; render(); return; }
  if(t.dataset.vocabSetupDir){ state.vocabSetup.direction=t.dataset.vocabSetupDir; state.vocabQuestion=null; render(); return; }
  if(t.dataset.vocabSetupMode){ state.vocabSetup.mode=t.dataset.vocabSetupMode; state.vocabQuestion=null; render(); return; }
  if(t.dataset.action==='vocab-setup-all'){ state.vocabSetup.categories=new Set(VOCAB_CATEGORIES); state.vocabQuestion=null; render(); return; }
  if(t.dataset.action==='vocab-setup-none'){ state.vocabSetup.categories=new Set(); state.vocabQuestion=null; render(); return; }

  // VOCAB QUIZ
  if(t.dataset.vocabMcq !== undefined){ if(!state.vocabResult){ submitVocabMCQ(decodeURIComponent(t.dataset.vocabMcq)); render(); } return; }
  if(t.dataset.action==='vocab-type-submit'){ submitVocabType(); render(); return; }
  if(t.dataset.action==='vocab-next'){ newVocabQuestion(); render(); return; }
});

document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(state.mode==='conjugation' && state.activeTab==='type' && !state.typeResult && state.typeQuestion){
    submitTypeGuess(); render();
  } else if(state.mode==='conjugation' && state.activeTab==='type' && state.typeResult){
    newTypeQuestion(); render();
  } else if(state.mode==='drill' && state.drillActiveTab==='drill' && !state.drillResult && state.drillQuestion){
    submitDrillGuess(); render();
  } else if(state.mode==='drill' && state.drillActiveTab==='drill' && state.drillResult){
    newDrillQuestion(); render();
  } else if(state.mode==='nouns' && state.nounActiveTab==='type' && !state.nounTypeResult && state.nounTypeQuestion){
    submitNounTypeGuess(); render();
  } else if(state.mode==='nouns' && state.nounActiveTab==='type' && state.nounTypeResult){
    newNounTypeQuestion(); render();
  } else if(state.mode==='vocab' && state.vocabActiveTab==='quiz' && state.vocabSetup.mode==='type' && !state.vocabResult && state.vocabQuestion){
    submitVocabType(); render();
  } else if(state.mode==='vocab' && state.vocabActiveTab==='quiz' && state.vocabResult){
    newVocabQuestion(); render();
  }
});

function toggleSet(set, key){ if(set.has(key)) set.delete(key); else set.add(key); }

function invalidateQuestions(){
  state.parseQuestion = null;
  state.parseResult = null;
  state.parseSel = {tense:null,voice:null,mood:null};
  state.typeQuestion = null;
  state.typeResult = null;
}

/* ============================== INIT ============================== */
render();
</script>
</body>
</html>
